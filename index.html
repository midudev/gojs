<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoJS.app - JavaScript/TypeScript Playground</title>
  <meta name="description" content="A modern JavaScript/TypeScript playground">
  <meta name="keywords" content="JavaScript, TypeScript, Playground, REPL, Monaco">
  <meta name="author" content="midudev">
  <meta name="robots" content="index, follow">
  <meta name="google" content="notranslate">
  <link rel="canonical" href="https://gojs.app/" />
  <link rel="icon" href="/gojs.webp" type="image/webp" />
  <meta name="theme-color" content="#0ea5e9" />

  <!-- Open Graph -->
  <meta property="og:title" content="GoJS.app - JavaScript/TypeScript Playground" />
  <meta property="og:description" content="A modern JavaScript/TypeScript playground" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://gojs.app/" />
  <meta property="og:image" content="https://gojs.app/og.webp" />
  <meta property="og:site_name" content="GoJS.app" />
  <meta property="og:locale" content="es_ES" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="GoJS.app - JavaScript/TypeScript Playground" />
  <meta name="twitter:description" content="A modern JavaScript/TypeScript playground" />
  <meta name="twitter:image" content="https://gojs.app/og.webp" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "GoJS.app",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Web",
    "url": "https://gojs.app/",
    "image": "/gojs.webp",
    "description": "A modern JavaScript/TypeScript playground",
    "author": {
      "@type": "Person",
      "name": "midudev"
    }
  }
  </script>
</head>

<body>
  <div id="app">
    <header class="header">
      <img src="/gojs.webp" alt="XJS Logo" class="header-logo">
      <div class="tabs-container">
        <!-- Aquí irán las pestañas en el futuro -->
      </div>
      <div class="header-actions">
        <button id="autorun-toggle-button" class="icon-button" title="Auto-run">
          <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M6 5m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z" />
            <path d="M14 5m0 1a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z" />
          </svg>
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: none">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M7 4v16l13 -8z" />
          </svg>
        </button>
        <button id="ai-toggle-button" class="icon-button" title="AI enabled (click to disable)">
          <svg id="robot-off-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            style="display: none">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M8 4h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2m-4 0h-4a2 2 0 0 1 -2 -2v-4" />
            <path d="M12 2v2" />
            <path d="M9 12v9" />
            <path d="M15 15v6" />
            <path d="M5 16l4 -2" />
            <path d="M9 18h6" />
            <path d="M14 8v.01" />
            <path d="M3 3l18 18" />
          </svg>
          <svg id="robot-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M6 4m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z" />
            <path d="M12 2v2" />
            <path d="M9 12v9" />
            <path d="M15 12v9" />
            <path d="M5 16l4 -2" />
            <path d="M15 14l4 2" />
            <path d="M9 18h6" />
            <path d="M10 8v.01" />
            <path d="M14 8v.01" />
          </svg>
        </button>
        <button id="layout-toggle-button" class="icon-button" type="button" title="Switch to vertical layout"
          aria-label="Switch to vertical layout" aria-pressed="true">
          <svg id="layout-horizontal-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5h16" />
            <path d="M4 19h16" />
            <path d="M4 9h7v6h-7z" />
            <path d="M13 9h7v6h-7z" />
          </svg>
          <svg id="layout-vertical-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
            style="display: none">
            <path d="M5 4v16" />
            <path d="M19 4v16" />
            <path d="M9 4h6v7h-6z" />
            <path d="M9 13h6v7h-6z" />
          </svg>
        </button>
        <a id="issue-button" class="icon-button" href="https://github.com/midudev/gojs-issues/issues/new"
          target="_blank" rel="noopener noreferrer" title="New issue">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M9 9v-1a3 3 0 0 1 6 0v1" />
            <path d="M8 9h8a6 6 0 0 1 1 3v3a5 5 0 0 1 -10 0v-3a6 6 0 0 1 1 -3" />
            <path d="M3 13l4 0" />
            <path d="M17 13l4 0" />
            <path d="M12 20l0 -6" />
            <path d="M4 19l3.35 -2" />
            <path d="M20 19l-3.35 -2" />
            <path d="M4 7l3.75 2.4" />
            <path d="M20 7l-3.75 2.4" />
          </svg>
        </a>
        <button id="settings-button" class="icon-button" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path
              d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
            <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
          </svg>
        </button>
      </div>
    </header>

    <main class="main-content">
      <resize-panels style="height: 100%;" responsive-config='{
        "default": "vertical",
        "breakpoints": [
          {
            "query": "(min-width: 768px)",
            "orientation": "horizontal"
          }
        ]
      }'>
        <div class="editor-panel">
          <div id="editor"></div>
        </div>

        <div class="output-panel">
          <div id="output" class="output-content"></div>
        </div>


        <div class="chatbot-panel" id="chatbot-panel">
          <div class="chatbot-header">
            <div class="chatbot-title">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M6 4m0 2a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2z" />
                <path d="M12 2v2" />
                <path d="M9 12v9" />
                <path d="M15 12v9" />
                <path d="M5 16l4 -2" />
                <path d="M15 14l4 2" />
                <path d="M9 18h6" />
                <path d="M10 8v.01" />
                <path d="M14 8v.01" />
              </svg>
              <span>AI Assistant</span>
            </div>
            <button id="chatbot-clear" class="chatbot-action-btn" title="Clear conversation" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 7l16 0" />
                <path d="M10 11l0 6" />
                <path d="M14 11l0 6" />
                <path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12" />
                <path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3" />
              </svg>
            </button>
          </div>
          <div class="chatbot-messages" id="chatbot-messages"></div>
          <div class="chatbot-input-container">
            <textarea id="chatbot-input" class="chatbot-input" placeholder="Ask about the code or the output..."
              rows="1" disabled></textarea>
            <button id="chatbot-send" class="chatbot-send-btn" disabled title="Send message">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M10 14l11 -11" />
                <path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" />
              </svg>
            </button>
          </div>
        </div>
      </resize-panels>
    </main>

    <!-- Tooltips (Popover API - hint) for header actions -->
    <div id="tooltip-autorun" class="tooltip" popover="hint">Auto execute</div>
    <div id="tooltip-ai" class="tooltip" popover="hint">Toggle AI</div>
    <div id="tooltip-layout" class="tooltip" popover="hint">Switch layout</div>
    <div id="tooltip-issue" class="tooltip" popover="hint">New issue</div>
    <div id="tooltip-settings" class="tooltip" popover="hint">Settings</div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title"
      aria-describedby="settings-description" aria-hidden="true" style="display: none">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h2 id="settings-title">Settings</h2>
          </div>
          <button id="close-settings" class="close-button" type="button" aria-label="Close settings">×</button>
        </div>
        <div class="modal-body">
          <div class="settings-tabs" role="tablist" aria-label="Settings sections">
            <button id="settings-tab-appearance" class="settings-tab active" type="button" role="tab"
              aria-selected="true" aria-controls="settings-panel-appearance" data-tab="appearance">
              <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M12 21a9 9 0 0 1 0 -18c4.97 0 9 3.582 9 8c0 1.06 -.474 2.078 -1.318 2.828c-.844 .75 -1.989 1.172 -3.182 1.172h-2.5a2 2 0 0 0 -1 3.75a1.3 1.3 0 0 1 -1 2.25" />
                <path d="M8.5 10.5m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                <path d="M12.5 7.5m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                <path d="M16.5 10.5m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
              </svg>
              <span>Appearance</span>
            </button>
            <button id="settings-tab-formatting" class="settings-tab" type="button" role="tab" aria-selected="false"
              aria-controls="settings-panel-formatting" tabindex="-1" data-tab="formatting">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1">
                <path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" />
                <path d="M13.5 6.5l4 4" />
                <path d="M15 19l2 2l4 -4" />
              </svg>
              <span>Formatting</span>
            </button>
            <button id="settings-tab-advanced" class="settings-tab" type="button" role="tab" aria-selected="false"
              aria-controls="settings-panel-advanced" tabindex="-1" data-tab="advanced">
              <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                  d="M12.501 20.93c-.866 .25 -1.914 -.166 -2.176 -1.247a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.074 .26 1.49 1.296 1.252 2.158" />
                <path d="M19 22v-6" />
                <path d="M22 19l-3 -3l-3 3" />
                <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
              </svg>
              <span>Advanced</span>
            </button>
          </div>
          <div class="settings-content">
            <!-- Appearance Tab -->
            <div id="settings-panel-appearance" class="settings-panel active" role="tabpanel"
              aria-labelledby="settings-tab-appearance" data-panel="appearance">
              <div class="setting-item">
                <label for="setting-theme">Theme</label>
                <select id="setting-theme">
                  <option value="vitesse-dark">Vitesse Dark</option>
                  <option value="vitesse-light">Vitesse Light</option>
                  <option value="github-dark">GitHub Dark</option>
                  <option value="github-light">GitHub Light</option>
                  <option value="dracula">Dracula</option>
                  <option value="monokai">Monokai</option>
                  <option value="nord">Nord</option>
                  <option value="tokyo-night">Tokyo Night</option>
                  <option value="one-dark-pro">One Dark Pro</option>
                </select>
              </div>
              <div class="setting-item">
                <label for="setting-font-family">Font Family</label>
                <select id="setting-font-family">
                  <option value="JetBrains Mono">JetBrains Mono</option>
                  <option value="Cascadia Code">Cascadia Code</option>
                </select>
              </div>
              <div class="setting-item">
                <label for="setting-font-size">Font Size</label>
                <input type="number" id="setting-font-size" min="10" max="30" value="14" />
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-minimap" />
                <label for="setting-minimap">Show minimap</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-line-numbers" checked />
                <label for="setting-line-numbers">Show line numbers</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-line-timings" checked />
                <label for="setting-line-timings">Show execution time per line</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-word-wrap" />
                <label for="setting-word-wrap">Wrap long lines</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-font-ligatures" checked />
                <label for="setting-font-ligatures">Enable font ligatures</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-sticky-scroll" checked />
                <label for="setting-sticky-scroll">Sticky scroll (pin scope headers)</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-indent-guides" checked />
                <label for="setting-indent-guides">Show indentation guides</label>
              </div>
              <div class="setting-item">
                <label for="setting-render-whitespace">Render whitespace</label>
                <select id="setting-render-whitespace">
                  <option value="none">none</option>
                  <option value="boundary">boundary</option>
                  <option value="selection">selection</option>
                  <option value="trailing">trailing</option>
                  <option value="all">all</option>
                </select>
              </div>
            </div>

            <!-- Formatting Tab -->
            <div id="settings-panel-formatting" class="settings-panel" role="tabpanel"
              aria-labelledby="settings-tab-formatting" data-panel="formatting" hidden>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-auto-format" />
                <label for="setting-auto-format">Automatically format code on run</label>
              </div>
              <div class="setting-item">
                <label for="setting-print-width">Print Width</label>
                <input type="number" id="setting-print-width" min="40" max="200" value="80" />
              </div>
              <div class="setting-item">
                <label for="setting-tab-width">Tab Width</label>
                <input type="number" id="setting-tab-width" min="1" max="8" value="2" />
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-semi" checked />
                <label for="setting-semi">Print semicolons at the ends of statements</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-single-quote" />
                <label for="setting-single-quote">Use single quotes instead of double quotes</label>
              </div>
              <div class="setting-item">
                <label for="setting-quote-props">Quote Props</label>
                <select id="setting-quote-props">
                  <option value="as-needed">as-needed</option>
                  <option value="consistent">consistent</option>
                  <option value="preserve">preserve</option>
                </select>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-jsx-single-quote" />
                <label for="setting-jsx-single-quote">Use single quotes instead of double quotes in JSX</label>
              </div>
              <div class="setting-item">
                <label for="setting-trailing-comma">Trailing Commas</label>
                <select id="setting-trailing-comma">
                  <option value="none">none</option>
                  <option value="es5">es5</option>
                  <option value="all">all</option>
                </select>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-bracket-spacing" checked />
                <label for="setting-bracket-spacing">Print spaces between brackets in object literals</label>
              </div>
              <div class="setting-item">
                <label for="setting-arrow-parens">Arrow Function Parentheses</label>
                <select id="setting-arrow-parens">
                  <option value="always">always</option>
                  <option value="avoid">avoid</option>
                </select>
              </div>
            </div>

            <!-- Advanced Tab -->
            <div id="settings-panel-advanced" class="settings-panel" role="tabpanel"
              aria-labelledby="settings-tab-advanced" data-panel="advanced" hidden>
              <div class="setting-group">
                <div class="setting-group-header">
                  <h3>AI Assistant</h3>
                  <p>Choose which model the chat uses and manage its local installation.</p>
                </div>
                <div class="setting-item">
                  <label for="setting-ai-model">Model</label>
                  <select id="setting-ai-model"></select>
                </div>
                <div id="setting-ai-model-meta" class="setting-help"></div>
                <div id="setting-ai-storage-usage" class="setting-help" aria-live="polite">
                  Calculating local AI storage...
                </div>
                <div id="setting-ai-model-status" class="setting-status">Checking model status...</div>
                <div class="setting-actions">
                  <button id="setting-ai-model-install" type="button" class="settings-action-button">
                    Download and load
                  </button>
                  <button id="setting-ai-model-uninstall" type="button" class="settings-action-button danger">
                    Uninstall
                  </button>
                  <button id="setting-ai-clear-local-data" type="button" class="settings-action-button danger"
                    aria-describedby="setting-ai-storage-usage setting-ai-model-status">
                    Clear all local AI data
                  </button>
                </div>
              </div>
              <div class="setting-item">
                <label for="setting-debounce">Auto-run delay (ms)</label>
                <input type="number" id="setting-debounce" min="100" max="5000" step="100" value="800" />
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-auto-log-expressions" checked />
                <label for="setting-auto-log-expressions">Automatically log expressions</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-format-on-paste" checked />
                <label for="setting-format-on-paste">Format on paste</label>
              </div>
              <div class="setting-item-checkbox">
                <input type="checkbox" id="setting-format-on-type" checked />
                <label for="setting-format-on-type">Format on type</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
