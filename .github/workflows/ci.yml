name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job opts into the exact permissions it needs.
permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test frontend
        run: pnpm test:browser --run

      - name: Build frontend
        run: pnpm build

  cargo:
    name: Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --locked

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

  workflows:
    name: Workflow security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit GitHub Actions workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --format=github .github
